<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de preparação para a P3 — Teoria Algébrica dos Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --board: #F7F9FB;
  --board-2: #EEF2F6;
  --ink: #1C2230;
  --muted: #5B6577;
  --rule: #D6DCE4;
  --blue: #1F4FA8;
  --red: #B9312C;
  --green: #1F7A4D;
  --blue-wash: #E3EBF8;
  --red-wash: #F8E6E5;
  --green-wash: #E2F2E9;
  --empty: #C9D1DC;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #12161D;
    --board-2: #1A2029;
    --ink: #E6EAF0;
    --muted: #9AA4B4;
    --rule: #2A313C;
    --blue: #8AB0F2;
    --red: #F08C84;
    --green: #7BCB9C;
    --blue-wash: #1C2840;
    --red-wash: #3A2222;
    --green-wash: #1B3328;
    --empty: #39414E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #12161D;
  --board-2: #1A2029;
  --ink: #E6EAF0;
  --muted: #9AA4B4;
  --rule: #2A313C;
  --blue: #8AB0F2;
  --red: #F08C84;
  --green: #7BCB9C;
  --blue-wash: #1C2840;
  --red-wash: #3A2222;
  --green-wash: #1B3328;
  --empty: #39414E;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--board);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--board);
}

/* ---------- régua de tracinhos ---------- */
.tally {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--board);
  border-bottom: 1px solid var(--rule);
}
.tally-inner {
  max-width: 46rem;
  margin: 0 auto;
  padding: 0.75rem 1.25rem 0.7rem;
  display: flex;
  align-items: flex-end;
  gap: 1.1rem;
  overflow-x: auto;
}
.group { display: flex; flex-direction: column; gap: 0.3rem; flex: 0 0 auto; }
.marks { display: flex; gap: 5px; align-items: flex-end; height: 26px; }
.mark {
  width: 6px;
  height: 22px;
  border-radius: 3px;
  background: var(--empty);
  transform: rotate(-6deg);
  transition: background-color 0.25s ease, height 0.25s ease;
}
.mark.current { background: var(--blue); height: 26px; }
.mark.right { background: var(--green); }
.mark.wrong { background: var(--red); }
.group-name { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.count { margin-left: auto; font-size: 0.85rem; color: var(--muted); white-space: nowrap; padding-bottom: 1.1rem; }

/* ---------- conteúdo ---------- */
main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-weight: 600;
  font-size: clamp(1.7rem, 4.5vw, 2.35rem);
  line-height: 1.15;
  margin: 0 0 0.75rem;
}
h2 {
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 600;
  font-size: 1.35rem;
  margin: 2rem 0 0.75rem;
}
.lead { font-size: 1.05rem; color: var(--muted); max-width: 38rem; margin: 0 0 1.5rem; }
.serif { font-family: "Source Serif 4", Georgia, serif; }

.topics { list-style: none; padding: 0; margin: 0 0 2rem; }
.topics li {
  display: flex;
  gap: 0.75rem;
  align-items: baseline;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--rule);
}
.topics li:last-child { border-bottom: 0; }
.topics .t-name { font-weight: 700; flex: 1 1 auto; }
.topics .t-dicas { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }

button {
  font: inherit;
  cursor: pointer;
}
.btn {
  display: inline-block;
  border: 2px solid var(--blue);
  background: var(--blue);
  color: var(--board);
  font-weight: 700;
  padding: 0.65rem 1.4rem;
  border-radius: 999px;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--blue); }
a.btn { text-decoration: none; }
.btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- questão ---------- */
.q-topic { color: var(--blue); font-weight: 700; font-size: 0.95rem; margin: 0 0 0.5rem; }
.q-text {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 1.15rem;
  line-height: 1.6;
  margin: 0 0 1.4rem;
}
.opts { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.25rem; }
.opt {
  display: flex;
  gap: 0.85rem;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  color: var(--ink);
  background: var(--board-2);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 0.8rem 1rem;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 1.05rem;
  line-height: 1.5;
}
.opt:hover:not([disabled]) { border-color: var(--blue); }
.opt .key {
  flex: 0 0 auto;
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--muted);
  border: 1.5px solid var(--rule);
  border-radius: 50%;
  width: 1.7rem;
  height: 1.7rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 0.1rem;
}
.opt[disabled] { cursor: default; }
.opt.is-right { background: var(--green-wash); border-color: var(--green); }
.opt.is-right .key { border-color: var(--green); color: var(--green); }
.opt.is-wrong { background: var(--red-wash); border-color: var(--red); }
.opt.is-wrong .key { border-color: var(--red); color: var(--red); }
.opt.faded { opacity: 0.55; }

.feedback {
  border-left: 4px solid var(--blue);
  padding: 0.25rem 0 0.25rem 1rem;
  margin: 0 0 1.5rem;
}
.feedback.right { border-color: var(--green); }
.feedback.wrong { border-color: var(--red); }
.verdict { font-weight: 700; margin: 0 0 0.35rem; }
.feedback.right .verdict { color: var(--green); }
.feedback.wrong .verdict { color: var(--red); }
.feedback .expl { font-family: "Source Serif 4", Georgia, serif; font-size: 1.02rem; line-height: 1.6; margin: 0 0 0.5rem; }
.feedback .see { font-size: 0.9rem; color: var(--muted); margin: 0; }
.nav { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.hint { font-size: 0.85rem; color: var(--muted); }

/* ---------- identificação ---------- */
.nome-box { margin: 0 0 1.5rem; max-width: 26rem; }
.nome-box label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
.nome-box input { width: 100%; font: inherit; padding: 0.6rem 0.8rem; border: 2px solid var(--rule); border-radius: 10px; background: var(--board); color: var(--ink); }
.nome-box input:focus { outline: none; border-color: var(--blue); }
.nome-box .erro { color: var(--red); font-size: 0.9rem; margin: 0.4rem 0 0; min-height: 1.2em; }
.ident { border: 2px solid var(--blue); background: var(--blue-wash); border-radius: 14px; padding: 1rem 1.25rem; margin: 0.5rem 0 1.5rem; }
.ident .quem { font-size: 1.4rem; font-weight: 700; margin: 0; }
.ident .quando { color: var(--muted); margin: 0.2rem 0 0.6rem; }
.ident .nota { font-family: "Source Serif 4", Georgia, serif; font-size: 2rem; font-weight: 600; margin: 0; }

/* ---------- resultado ---------- */
.score {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: clamp(2.6rem, 9vw, 3.6rem);
  font-weight: 600;
  line-height: 1;
  margin: 0.25rem 0 0.5rem;
}
.score small { font-size: 0.45em; color: var(--muted); font-weight: 400; }
.diag { list-style: none; padding: 0; margin: 1rem 0 2rem; }
.diag li { padding: 1rem 0; border-bottom: 1px solid var(--rule); }
.diag li:last-child { border-bottom: 0; }
.diag-head { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.diag-name { font-weight: 700; flex: 1 1 14rem; }
.diag .marks { height: 24px; }
.diag-verdict { margin: 0.4rem 0 0; font-size: 0.95rem; }
.diag-verdict.ok { color: var(--green); }
.diag-verdict.mid { color: var(--blue); }
.diag-verdict.weak { color: var(--red); }
.review { margin: 0 0 1.5rem; }
.review-item { border-left: 4px solid var(--red); padding: 0.1rem 0 0.1rem 1rem; margin: 0 0 1.25rem; }
.review-item .q-text { font-size: 1.02rem; margin-bottom: 0.5rem; }
.review-item p { margin: 0 0 0.4rem; }
.ans { font-family: "Source Serif 4", Georgia, serif; }
.label-right { color: var(--green); font-weight: 700; }
.label-wrong { color: var(--red); font-weight: 700; }

mjx-container { color: inherit; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .mark { transition: none; }
}
@media (max-width: 520px) {
  .tally-inner { gap: 0.8rem; padding: 0.6rem 1rem; }
  .group-name { display: none; }
  .count { padding-bottom: 0; }
  main { padding-top: 1.5rem; }
}
</style>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     Temas e dicas correspondentes (numeração da lista de dicas da P3)
  ------------------------------------------------------------------ */
  var TOPICS = [
    { name: "Imersão canônica", long: "Imersão canônica e volume", dicas: "dicas 1 a 4" },
    { name: "Grupo de classes", long: "Grupo de classes e cota de Minkowski", dicas: "dicas 5 a 13" },
    { name: "Número de classes", long: "Cálculo do número de classes", dicas: "dicas 14 a 18" },
    { name: "Imersão logarítmica", long: "Imersão logarítmica e raízes da unidade", dicas: "dicas 19 a 24" },
    { name: "Dirichlet", long: "Teorema de Dirichlet e unidades", dicas: "dicas 25 a 34" }
  ];

  var BANK = [
    // ---------- Tema 0: imersão canônica e volume
    { t: 0, dica: "dica 1",
      q: "Para $K = \\Q(\\sqrt[3]{2})$, quanto valem $s$, $t$ e a dimensão real de $\\mathcal{L}^{st}$?",
      o: ["$s = 1$, $t = 1$, e a dimensão é $3$.", "$s = 3$, $t = 0$, e a dimensão é $3$.", "$s = 1$, $t = 2$, e a dimensão é $5$.", "$s = 1$, $t = 1$, e a dimensão é $2$."],
      e: "$x^3 - 2$ tem uma raiz real e um par de raízes complexas conjugadas: $s = 1$ e $t = 1$. A dimensão real de $\\mathcal{L}^{st} = \\R^s \\times \\C^t$ é $s + 2t = 3 = n$: cada par complexo contribui com uma coordenada complexa, isto é, duas reais." },
    { t: 0, dica: "dica 1",
      q: "Para $K = \\Q(\\zeta_7)$, quanto valem $s$ e $t$?",
      o: ["$s = 0$ e $t = 3$.", "$s = 6$ e $t = 0$.", "$s = 0$ e $t = 6$.", "$s = 2$ e $t = 2$."],
      e: "Nenhuma raiz primitiva sétima da unidade é real, então os $6$ monomorfismos formam $3$ pares conjugados. Em geral, $\\Q(\\zeta_p)$ com $p$ ímpar é totalmente complexo, com $t = \\frac{p-1}{2}$." },
    { t: 0, dica: "dica 3",
      q: "Qual é o volume do domínio fundamental de $\\sigma(\\OK)$ para $K = \\Q(i)$?",
      o: ["$1$", "$2$", "$\\tfrac12$", "$4$"],
      e: "$2^{-t}\\sqrt{|\\Delta_K|} = 2^{-1}\\sqrt4 = 1$. Confere com a geometria: identificando $\\C$ com $\\R^2$, $\\sigma(\\Z[i])$ é a rede $\\Z^2$, de volume $1$." },
    { t: 0, dica: "dica 3",
      q: "Em $K = \\Q(\\sqrt{-5})$, com $\\Delta_K = -20$, o ideal $P = \\langle 2, 1+\\sqrt{-5}\\rangle$ tem norma $2$. Qual é o volume do domínio fundamental de $\\sigma(P)$?",
      o: ["$2\\sqrt5$", "$\\sqrt5$", "$4\\sqrt5$", "$\\sqrt{10}$"],
      e: "$\\operatorname{vol}(\\sigma(P)) = 2^{-t}\\N(P)\\sqrt{|\\Delta_K|} = \\tfrac12 \\cdot 2 \\cdot \\sqrt{20} = 2\\sqrt5$: o volume de $\\sigma(\\OK)$, que é $\\sqrt5$, multiplicado pelo índice $\\N(P) = 2$." },
    { t: 0, dica: "dica 4",
      q: "Para $\\alpha \\in K$, quanto vale a norma de Minkowski $\\N(\\sigma(\\alpha)) = \\sigma_1(\\alpha)\\cdots\\sigma_s(\\alpha)\\,|\\sigma_{s+1}(\\alpha)|^2 \\cdots |\\sigma_{s+t}(\\alpha)|^2$?",
      o: ["$\\N(\\alpha)$", "$|\\N(\\alpha)|^2$", "$\\operatorname{Tr}(\\alpha)$", "$\\N(\\alpha)^{1/n}$"],
      e: "Como $|\\sigma_{s+j}(\\alpha)|^2 = \\sigma_{s+j}(\\alpha)\\,\\overline{\\sigma_{s+j}(\\alpha)}$, e os conjugados complexos são exatamente os monomorfismos que faltam, o produto é $\\prod_{i=1}^n \\sigma_i(\\alpha) = \\N(\\alpha)$. É isso que liga a geometria de $\\mathcal{L}^{st}$ à aritmética de $K$." },
    { t: 0, dica: "dica 1",
      q: "Na prova de que $\\sigma(\\alpha_1), \\dots, \\sigma(\\alpha_n)$ são $\\R$-linearmente independentes, troca-se cada par de colunas $(\\operatorname{Re}\\sigma_{s+j}, \\operatorname{Im}\\sigma_{s+j})$ por $(\\sigma_{s+j}, \\overline{\\sigma}_{s+j})$. Para quê?",
      o: ["Para chegar à matriz $(\\sigma_i(\\alpha_j))$, cujo determinante ao quadrado é $\\Delta(\\alpha_1,\\dots,\\alpha_n) \\neq 0$; a troca só multiplica o determinante por $(-2i)^t$.",
          "Para tornar a matriz real.",
          "Para que o determinante passe a valer $1$.",
          "Porque $\\operatorname{Re}$ e $\\operatorname{Im}$ não são funções lineares."],
      e: "As colunas $(y, z)$ viram $(y + iz,\\ y - iz)$, operação de determinante $-2i$. Assim o determinante original é não nulo se, e só se, $\\det(\\sigma_i(\\alpha_j)) \\neq 0$, e o quadrado deste é o discriminante, não nulo para uma base. $\\operatorname{Re}$ e $\\operatorname{Im}$ são $\\R$-lineares." },
    { t: 0, dica: "dica 2",
      q: "Por que $\\sigma(\\OK)$ é uma rede em $\\mathcal{L}^{st}$, mas $\\sigma(K)$ não é?",
      o: ["$\\sigma(\\OK)$ é gerado pela imagem de uma $\\Z$-base de $\\OK$, que são $n$ vetores $\\R$-linearmente independentes; já $\\sigma(K)$ é denso em $\\mathcal{L}^{st}$.",
          "Porque $\\OK$ é finito e $K$ é infinito.",
          "Porque $\\sigma$ é injetora em $\\OK$, mas não em $K$.",
          "Porque $\\sigma(K)$ não é um subgrupo aditivo."],
      e: "Uma $\\Z$-base de $\\OK$ tem $n$ elementos $\\Q$-linearmente independentes, que $\\sigma$ leva em vetores $\\R$-linearmente independentes. Como $K = \\Q \\cdot \\OK$, o conjunto $\\sigma(K)$ contém múltiplos racionais arbitrariamente pequenos dos vetores da rede: é denso e não discreto. A imersão $\\sigma$ é injetora em todo $K$." },
    { t: 0, dica: "dica 3",
      q: "Se $J \\subseteq I$ são ideais não nulos de $\\OK$ com $|I/J| = 3$, quanto vale $\\operatorname{vol}(\\sigma(J))/\\operatorname{vol}(\\sigma(I))$?",
      o: ["$3$", "$9$", "$\\tfrac13$", "$\\sqrt3$"],
      e: "$\\N(J) = |\\OK/J| = |\\OK/I| \\cdot |I/J| = 3\\N(I)$, e o volume é proporcional à norma. Geometricamente: o índice de uma sub-rede é a razão entre os volumes dos domínios fundamentais." },

    // ---------- Tema 1: grupo de classes e cota de Minkowski
    { t: 1, dica: "dica 7",
      q: "Na prova da cota de Minkowski, aplica-se o Teorema de Minkowski à rede $\\sigma(I)$ e ao conjunto $X_c = \\{x : \\sum_{i \\le s}|x_i| + 2\\sum_{j \\le t}|x_{s+j}| < c\\}$, de volume $2^s\\left(\\frac\\pi2\\right)^t\\frac{c^n}{n!}$. A condição $\\operatorname{vol}(X_c) > 2^n \\operatorname{vol}(\\sigma(I))$ equivale a:",
      o: ["$c^n > \\left(\\frac4\\pi\\right)^t n!\\,\\N(I)\\sqrt{|\\Delta_K|}$", "$c^n > \\left(\\frac2\\pi\\right)^t n!\\,\\N(I)\\sqrt{|\\Delta_K|}$", "$c^n > M_{st}\\,\\N(I)\\sqrt{|\\Delta_K|}$", "$c^n > \\left(\\frac4\\pi\\right)^t \\N(I)\\sqrt{|\\Delta_K|}$"],
      e: "Com $\\operatorname{vol}(\\sigma(I)) = 2^{-t}\\N(I)\\sqrt{|\\Delta_K|}$, a condição é $2^s\\left(\\frac\\pi2\\right)^t\\frac{c^n}{n!} > 2^{s+t}\\N(I)\\sqrt{|\\Delta_K|}$, isto é, $c^n > \\left(\\frac4\\pi\\right)^t n!\\,\\N(I)\\sqrt{|\\Delta_K|}$. Para o $\\alpha$ obtido, a desigualdade entre as médias dá $|\\N(\\alpha)| < \\left(\\frac cn\\right)^n$, e $\\frac{c^n}{n^n}$ fica tão perto quanto se queira de $M_{st}\\N(I)\\sqrt{|\\Delta_K|}$." },
    { t: 1, dica: "dica 6",
      q: "Para $K$ quadrático imaginário ($s = 0$, $t = 1$), o conjunto $X_c = \\{x \\in \\mathcal{L}^{st} : 2|x_1| < c\\}$ é:",
      o: ["o disco de raio $\\frac c2$, de área $\\frac{\\pi c^2}{4}$.", "o disco de raio $c$, de área $\\pi c^2$.", "o quadrado $|y| + |z| < c$, de área $2c^2$.", "o disco de raio $\\frac c2$, de área $\\frac{\\pi c^2}{2}$."],
      e: "Escrevendo $x_1 = y + iz$, a condição é $\\sqrt{y^2+z^2} < \\frac c2$. Confere com a fórmula geral $\\operatorname{vol}(X_c) = 2^s\\left(\\frac\\pi2\\right)^t\\frac{c^n}{n!} = \\frac\\pi2 \\cdot \\frac{c^2}{2}$. O fator $2$ diante de $|x_{s+j}|$ vem de cada coordenada complexa contar duas vezes na norma: $|\\N(\\alpha)|$ é o produto de $n$ números cuja soma é a expressão que define $X_c$." },
    { t: 1, dica: "dica 9",
      q: "Por que o grupo de classes $\\mathcal{H}$ é finito?",
      o: ["Toda classe contém um ideal de norma limitada por uma constante que só depende de $K$, e há apenas finitos ideais com norma limitada.",
          "Porque $\\OK$ é noetheriano.",
          "Porque $\\OK$ tem apenas finitos ideais primos.",
          "Porque todo ideal fracionário é principal."],
      e: "A cota $M_{st}\\sqrt{|\\Delta_K|}$ não depende da classe. E há finitos ideais de norma $\\le B$: cada um contém a sua norma, um inteiro $\\le B$, e há finitos ideais contendo um inteiro fixo. $\\OK$ tem infinitos primos." },
    { t: 1, dica: "dica 10",
      q: "Se $h = 5$ e $I^3$ é principal, então:",
      o: ["$I$ é principal.", "$I^5$ não é principal.", "$I^2$ é principal, mas $I$ não.", "Nada se pode concluir."],
      e: "A ordem de $[I]$ divide $3$, porque $I^3$ é principal, e divide $h = 5$. Como $\\operatorname{mdc}(3,5) = 1$, a ordem é $1$. Explicitamente, $1 = 2\\cdot 3 - 5$ dá $[I] = [I]^{6}[I]^{-5} = 1$." },
    { t: 1, dica: "dica 10",
      q: "Se $h = 4$ e $I^2$ é principal, $I$ é necessariamente principal?",
      o: ["Não: $\\operatorname{mdc}(2, 4) = 2$, e a classe de $I$ pode ter ordem $2$.",
          "Sim, sempre.",
          "Sim, porque $I^4$ é principal.",
          "Não; aliás, $I$ nunca é principal."],
      e: "O lema só se aplica com $\\operatorname{mdc}(q, h) = 1$. Um exemplo do fenômeno, com $h = 2$: em $\\Z[\\sqrt{-5}]$, $P = \\langle 2, 1+\\sqrt{-5}\\rangle$ não é principal, mas $P^2 = \\langle 2 \\rangle$ é." },
    { t: 1, dica: "dica 12",
      q: "O critério de DIP só pede que os primos $P$ com $\\N(P) \\le M_{st}\\sqrt{|\\Delta_K|}$ sejam principais. Por que basta olhar esses primos?",
      o: ["Toda classe contém um ideal $I$ com $\\N(I) \\le M_{st}\\sqrt{|\\Delta_K|}$; cada fator primo de $I$ tem norma $\\le \\N(I)$; se todos forem principais, $I$ é principal.",
          "Porque todo ideal de norma grande é principal.",
          "Porque o grupo de classes é gerado pelos primos de norma $2$.",
          "Porque primos de norma grande são sempre inertes."],

  /* ------------------------------------------------------------------
     Sorteio: a cada tentativa, 4 questões de cada tema, escolhidas
     entre as 40 do banco. Dá preferência às menos vistas neste navegador.
  ------------------------------------------------------------------ */
  var PER_TOPIC = 4;
  var SEEN_KEY = "quiz-p3-tan:vistas:v1";
  function shuffleArr(a) {
    a = a.slice();
    for (var j = a.length - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[r]; a[r] = t;
    }
    return a;
  }
  function loadSeen() {
    try { var v = JSON.parse(localStorage.getItem(SEEN_KEY)); return (v && typeof v === "object") ? v : {}; }
    catch (e) { return {}; }
  }
  function saveSeen(v) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(v)); } catch (e) {} }
  var seen = loadSeen();
  function draw() {
    var sel = [];
    TOPICS.forEach(function (tp, ti) {
      var pool = [];
      BANK.forEach(function (q, bi) { if (q.t === ti) pool.push(bi); });
      pool = shuffleArr(pool);
      pool.sort(function (a, b) { return (seen[a] || 0) - (seen[b] || 0); });
      pool.slice(0, PER_TOPIC).forEach(function (bi) { sel.push(bi); });
    });
    sel.forEach(function (bi) { seen[bi] = (seen[bi] || 0) + 1; });
    saveSeen(seen);
    return sel.map(function (bi) { return BANK[bi]; });
  }
  var QUESTIONS = (function () {
    var out = [];
    TOPICS.forEach(function (tp, ti) {
      BANK.filter(function (q) { return q.t === ti; }).slice(0, PER_TOPIC).forEach(function (q) { out.push(q); });
    });
    return out;
  })();


  /* ------------------------------------------------------------------
     Estado
  ------------------------------------------------------------------ */
  var state = { i: 0, answers: [], order: [] };
  var app = document.getElementById("app");
  var tally = document.getElementById("tally");
  var KEYS = ["a", "b", "c", "d"];

  var mjResolve;
  var mjReady = new Promise(function (res) { mjResolve = res; });
  window.__mjReady = function () { mjResolve(); };
  setTimeout(function () { mjResolve(); }, 8000);

  function typeset(el) {
    return mjReady.then(function () {
      if (window.MathJax && MathJax.typesetPromise) {
        return MathJax.typesetPromise([el]).catch(function () {});
      }
    });
  }
  function clearMath(el) {
    if (window.MathJax && MathJax.typesetClear) { try { MathJax.typesetClear([el]); } catch (e) {} }
  }
  function shuffle(n) {
    var a = [];
    for (var k = 0; k < n; k++) a.push(k);
    for (var j = n - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[r]; a[r] = t;
    }
    return a;
  }

  /* ------------------------------------------------------------------
     Régua de tracinhos
  ------------------------------------------------------------------ */
  function renderTally() {
    var html = "";
    TOPICS.forEach(function (tp, ti) {
      html += '<div class="group"><div class="marks">';
      QUESTIONS.forEach(function (q, qi) {
        if (q.t !== ti) return;
        var cls = "mark";
        var a = state.answers[qi];
        if (a === true) cls += " right";
        else if (a === false) cls += " wrong";
        else if (qi === state.i && state.started && !state.done) cls += " current";
        html += '<span class="' + cls + '"></span>';
      });
      html += '</div><span class="group-name">' + tp.name + "</span></div>";
    });
    var answered = state.answers.filter(function (x) { return x !== undefined; }).length;
    html += '<span class="count">' + answered + " de " + QUESTIONS.length + "</span>";
    tally.innerHTML = html;
  }

     Telas
  ------------------------------------------------------------------ */

      '<p class="lead">Teoria Algébrica dos Números. São 20 questões de múltipla escolha, quatro por tema, sorteadas a cada tentativa de um banco de 40 — oito por tema. Ao refazer o quiz, você recebe de preferência questões que ainda não viu. ' +
      "Cada resposta é corrigida na hora, com a justificativa e a dica da lista que trata do assunto. " +

      '<span class="hint">Use as teclas 1 a 4 para responder e Enter para avançar.</span></div>';
    var campo = document.getElementById("nome");
    function comecar() {
      var n = campo.value.trim();
      if (!n) { document.getElementById("nome-erro").textContent = "Escreva seu nome para começar."; campo.focus(); return; }
      nomeAluno = n;
      start();
    }
    document.getElementById("start").addEventListener("click", comecar);
    campo.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); comecar(); } });
    renderTally();
  }

  function start() {
    QUESTIONS = draw();
    state = { i: 0, answers: [], order: QUESTIONS.map(function (q) { return shuffle(q.o.length); }), started: true, done: false };
    renderQuestion();
  }

  function renderQuestion() {
    var qi = state.i, q = QUESTIONS[qi], order = state.order[qi];
    clearMath(app);
    var opts = order.map(function (oi, pos) {
      return '<button class="opt" data-oi="' + oi + '"><span class="key">' + KEYS[pos] + "</span><span>" + q.o[oi] + "</span></button>";
    }).join("");
    app.innerHTML =
      '<p class="q-topic">Questão ' + (qi + 1) + " de " + QUESTIONS.length + ": " + TOPICS[q.t].long + "</p>" +
      '<div class="q-text">' + q.q + "</div>" +
      '<div class="opts" role="group" aria-label="Alternativas">' + opts + "</div>" +
      '<div id="fb"></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () { answer(parseInt(b.getAttribute("data-oi"), 10)); });
    });
    renderTally();
    typeset(app).then(function () {
      var first = app.querySelector(".opt");
      if (first) first.focus({ preventScroll: true });
    });
    window.scrollTo({ top: 0 });
  }

  function answer(oi) {
    var qi = state.i;
    if (state.answers[qi] !== undefined) return;
    var q = QUESTIONS[qi];
    var ok = oi === 0;
    state.answers[qi] = ok;
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      var bo = parseInt(b.getAttribute("data-oi"), 10);
      b.disabled = true;
      if (bo === 0) b.classList.add("is-right");
      else if (bo === oi) b.classList.add("is-wrong");
      else b.classList.add("faded");
    });
    var last = qi === QUESTIONS.length - 1;
    var fb = document.getElementById("fb");
    fb.innerHTML =
      '<div class="feedback ' + (ok ? "right" : "wrong") + '">' +
      '<p class="verdict">' + (ok ? "Correto." : "Não é essa.") + "</p>" +
      '<p class="expl">' + q.e + "</p>" +
      '<p class="see">Para rever: ' + q.dica + " da lista de dicas.</p></div>" +
      '<div class="nav"><button class="btn" id="next">' + (last ? "Ver o diagnóstico" : "Próxima questão") + "</button></div>";
    document.getElementById("next").addEventListener("click", next);
    renderTally();
    typeset(fb).then(function () {
      document.getElementById("next").focus({ preventScroll: true });
      fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
  }

  function next() {
    if (state.i < QUESTIONS.length - 1) { state.i++; renderQuestion(); }
    else { state.done = true; renderResults(); }
  }

  function verdictFor(n) {
    if (n === 4) return { cls: "ok", txt: "Seguro neste tema." };
    if (n === 3) return { cls: "mid", txt: "Quase lá: reveja a questão que errou." };
    return { cls: "weak", txt: "Ponto fraco: vale estudar este tema antes da prova." };
  }

  function renderResults() {
    clearMath(app);
    var total = state.answers.filter(function (x) { return x === true; }).length;
    var diag = TOPICS.map(function (tp, ti) {
      var marks = "", right = 0;
      QUESTIONS.forEach(function (q, qi) {
        if (q.t !== ti) return;
        var a = state.answers[qi];
        if (a) right++;
        marks += '<span class="mark ' + (a ? "right" : "wrong") + '"></span>';
      });
      var v = verdictFor(right);
      var extra = right < 4 ? " Revise as " + tp.dicas + "." : "";
      return '<li><div class="diag-head"><span class="diag-name">' + tp.long + '</span><span class="marks">' + marks +
             '</span><span>' + right + " de 4</span></div>" +
             '<p class="diag-verdict ' + v.cls + '">' + v.txt + extra + "</p></li>";
    }).join("");

    var wrong = [];
    QUESTIONS.forEach(function (q, qi) { if (state.answers[qi] === false) wrong.push(qi); });
    var review = wrong.length === 0
      ? "<p>Você acertou todas. Ainda assim, vale escrever à mão as demonstrações das dicas: na prova, as questões pedem provas completas.</p>"
      : wrong.map(function (qi) {
          var q = QUESTIONS[qi];
          return '<div class="review-item"><div class="q-text">' + (qi + 1) + ". " + q.q + "</div>" +
                 '<p class="ans"><span class="label-right">Resposta:</span> ' + q.o[0] + "</p>" +
                 '<p class="ans">' + q.e + "</p>" +
                 '<p class="see">Para rever: ' + q.dica + ".</p></div>";
        }).join("");

    app.innerHTML =
      "<h1>Seu diagnóstico</h1>" +
      '<div class="ident"><p class="quem">' + esc(nomeAluno) + '</p>' +
      '<p class="quando">Concluído em ' + new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + '</p>' +
      '<p class="nota">' + total + " de " + QUESTIONS.length + " acertos</p></div>" +
      '<p class="lead">Cada linha mostra um tema da prova. Os temas em vermelho são os que pedem mais estudo; ' +
      "a numeração das dicas é a da lista distribuída para a P3.</p>" +
      '<ul class="diag">' + diag + "</ul>" +
      (wrong.length ? "<h2>As questões que você errou</h2>" : "<h2>Resultado</h2>") +
      '<div class="review">' + review + "</div>" +
      '<div class="nav"><button class="btn" id="again">Refazer o quiz</button>' +
      '<a class="btn ghost" href="index.html">Outros testes da disciplina</a>' +
      '<a class="btn ghost" href="../index.html">Voltar às disciplinas</a></div>';
    document.getElementById("again").addEventListener("click", start);
    renderTally();
    typeset(app);
    window.scrollTo({ top: 0 });
  }

  /* ------------------------------------------------------------------
     Teclado
  ------------------------------------------------------------------ */
  document.addEventListener("keydown", function (ev) {
    if (!state.started || state.done) return;
    if (ev.key >= "1" && ev.key <= "4") {
      var b = app.querySelectorAll(".opt")[parseInt(ev.key, 10) - 1];
      if (b && !b.disabled) { ev.preventDefault(); b.click(); }
    } else if (ev.key === "Enter" || ev.key === "ArrowRight") {
      var n = document.getElementById("next");
      if (n && state.answers[state.i] !== undefined) { ev.preventDefault(); n.click(); }
    }
  });

  renderIntro();
})();
</script>
</body>
</html>
