<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de preparação para a P2 — Teoria Algébrica dos Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --board: #F7F9FB;
  --board-2: #EEF2F6;
  --ink: #1C2230;
  --muted: #5B6577;
  --rule: #D6DCE4;
  --blue: #1F4FA8;
  --red: #B9312C;
  --green: #1F7A4D;
  --blue-wash: #E3EBF8;
  --red-wash: #F8E6E5;
  --green-wash: #E2F2E9;
  --empty: #C9D1DC;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #12161D;
    --board-2: #1A2029;
    --ink: #E6EAF0;
    --muted: #9AA4B4;
    --rule: #2A313C;
    --blue: #8AB0F2;
    --red: #F08C84;
    --green: #7BCB9C;
    --blue-wash: #1C2840;
    --red-wash: #3A2222;
    --green-wash: #1B3328;
    --empty: #39414E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #12161D;
  --board-2: #1A2029;
  --ink: #E6EAF0;
  --muted: #9AA4B4;
  --rule: #2A313C;
  --blue: #8AB0F2;
  --red: #F08C84;
  --green: #7BCB9C;
  --blue-wash: #1C2840;
  --red-wash: #3A2222;
  --green-wash: #1B3328;
  --empty: #39414E;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--board);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--board);
}

/* ---------- régua de tracinhos ---------- */
.tally {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--board);
  border-bottom: 1px solid var(--rule);
}
.tally-inner {
  max-width: 46rem;
  margin: 0 auto;
  padding: 0.75rem 1.25rem 0.7rem;
  display: flex;
  align-items: flex-end;
  gap: 1.1rem;
  overflow-x: auto;
}
.group { display: flex; flex-direction: column; gap: 0.3rem; flex: 0 0 auto; }
.marks { display: flex; gap: 5px; align-items: flex-end; height: 26px; }
.mark {
  width: 6px;
  height: 22px;
  border-radius: 3px;
  background: var(--empty);
  transform: rotate(-6deg);
  transition: background-color 0.25s ease, height 0.25s ease;
}
.mark.current { background: var(--blue); height: 26px; }
.mark.right { background: var(--green); }
.mark.wrong { background: var(--red); }
.group-name { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.count { margin-left: auto; font-size: 0.85rem; color: var(--muted); white-space: nowrap; padding-bottom: 1.1rem; }

/* ---------- conteúdo ---------- */
main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 {
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-weight: 600;
  font-size: clamp(1.7rem, 4.5vw, 2.35rem);
  line-height: 1.15;
  margin: 0 0 0.75rem;
}
h2 {
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 600;
  font-size: 1.35rem;
  margin: 2rem 0 0.75rem;
}
.lead { font-size: 1.05rem; color: var(--muted); max-width: 38rem; margin: 0 0 1.5rem; }
.serif { font-family: "Source Serif 4", Georgia, serif; }

.topics { list-style: none; padding: 0; margin: 0 0 2rem; }
.topics li {
  display: flex;
  gap: 0.75rem;
  align-items: baseline;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--rule);
}
.topics li:last-child { border-bottom: 0; }
.topics .t-name { font-weight: 700; flex: 1 1 auto; }
.topics .t-dicas { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }

button {
  font: inherit;
  cursor: pointer;
}
.btn {
  display: inline-block;
  border: 2px solid var(--blue);
  background: var(--blue);
  color: var(--board);
  font-weight: 700;
  padding: 0.65rem 1.4rem;
  border-radius: 999px;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--blue); }
a.btn { text-decoration: none; }
.btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- questão ---------- */
.q-topic { color: var(--blue); font-weight: 700; font-size: 0.95rem; margin: 0 0 0.5rem; }
.q-text {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 1.15rem;
  line-height: 1.6;
  margin: 0 0 1.4rem;
}
.opts { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.25rem; }
.opt {
  display: flex;
  gap: 0.85rem;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  color: var(--ink);
  background: var(--board-2);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 0.8rem 1rem;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 1.05rem;
  line-height: 1.5;
}
.opt:hover:not([disabled]) { border-color: var(--blue); }
.opt .key {
  flex: 0 0 auto;
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--muted);
  border: 1.5px solid var(--rule);
  border-radius: 50%;
  width: 1.7rem;
  height: 1.7rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 0.1rem;
}
.opt[disabled] { cursor: default; }
.opt.is-right { background: var(--green-wash); border-color: var(--green); }
.opt.is-right .key { border-color: var(--green); color: var(--green); }
.opt.is-wrong { background: var(--red-wash); border-color: var(--red); }
.opt.is-wrong .key { border-color: var(--red); color: var(--red); }
.opt.faded { opacity: 0.55; }

.feedback {
  border-left: 4px solid var(--blue);
  padding: 0.25rem 0 0.25rem 1rem;
  margin: 0 0 1.5rem;
}
.feedback.right { border-color: var(--green); }
.feedback.wrong { border-color: var(--red); }
.verdict { font-weight: 700; margin: 0 0 0.35rem; }
.feedback.right .verdict { color: var(--green); }
.feedback.wrong .verdict { color: var(--red); }
.feedback .expl { font-family: "Source Serif 4", Georgia, serif; font-size: 1.02rem; line-height: 1.6; margin: 0 0 0.5rem; }
.feedback .see { font-size: 0.9rem; color: var(--muted); margin: 0; }
.nav { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.hint { font-size: 0.85rem; color: var(--muted); }

/* ---------- identificação ---------- */
.nome-box { margin: 0 0 1.5rem; max-width: 26rem; }
.nome-box label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
.nome-box input { width: 100%; font: inherit; padding: 0.6rem 0.8rem; border: 2px solid var(--rule); border-radius: 10px; background: var(--board); color: var(--ink); }
.nome-box input:focus { outline: none; border-color: var(--blue); }
.nome-box .erro { color: var(--red); font-size: 0.9rem; margin: 0.4rem 0 0; min-height: 1.2em; }
.ident { border: 2px solid var(--blue); background: var(--blue-wash); border-radius: 14px; padding: 1rem 1.25rem; margin: 0.5rem 0 1.5rem; }
.ident .quem { font-size: 1.4rem; font-weight: 700; margin: 0; }
.ident .quando { color: var(--muted); margin: 0.2rem 0 0.6rem; }
.ident .nota { font-family: "Source Serif 4", Georgia, serif; font-size: 2rem; font-weight: 600; margin: 0; }

/* ---------- resultado ---------- */
.score {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: clamp(2.6rem, 9vw, 3.6rem);
  font-weight: 600;
  line-height: 1;
  margin: 0.25rem 0 0.5rem;
}
.score small { font-size: 0.45em; color: var(--muted); font-weight: 400; }
.diag { list-style: none; padding: 0; margin: 1rem 0 2rem; }
.diag li { padding: 1rem 0; border-bottom: 1px solid var(--rule); }
.diag li:last-child { border-bottom: 0; }
.diag-head { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.diag-name { font-weight: 700; flex: 1 1 14rem; }
.diag .marks { height: 24px; }
.diag-verdict { margin: 0.4rem 0 0; font-size: 0.95rem; }
.diag-verdict.ok { color: var(--green); }
.diag-verdict.mid { color: var(--blue); }
.diag-verdict.weak { color: var(--red); }
.review { margin: 0 0 1.5rem; }
.review-item { border-left: 4px solid var(--red); padding: 0.1rem 0 0.1rem 1rem; margin: 0 0 1.25rem; }
.review-item .q-text { font-size: 1.02rem; margin-bottom: 0.5rem; }
.review-item p { margin: 0 0 0.4rem; }
.ans { font-family: "Source Serif 4", Georgia, serif; }
.label-right { color: var(--green); font-weight: 700; }
.label-wrong { color: var(--red); font-weight: 700; }

mjx-container { color: inherit; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .mark { transition: none; }
}
@media (max-width: 520px) {
  .tally-inner { gap: 0.8rem; padding: 0.6rem 1rem; }
  .group-name { display: none; }
  .count { padding-bottom: 0; }
  main { padding-top: 1.5rem; }
}
</style>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     Temas e dicas correspondentes (numeração da lista de dicas da P2)
  ------------------------------------------------------------------ */
  var TOPICS = [
    { name: "Ideais fracionários", long: "Anéis de Dedekind e ideais fracionários", dicas: "dicas 1 a 10 e 29 a 32" },
    { name: "Norma", long: "Norma de ideais", dicas: "dicas 11 a 17 e 33" },
    { name: "Kummer", long: "Teoria de Kummer e ramificação", dicas: "dicas 18 a 24 e 34" },
    { name: "Fatoração", long: "Fatoração explícita", dicas: "dicas 25 a 28" },
    { name: "Redes", long: "Redes, Minkowski e somas de quadrados", dicas: "dicas 35 a 51" }
  ];

  var BANK = [

    // ---------- Tema 0: ideais fracionários
    { t: 0, dica: "dica 1",
      q: "Qual das propriedades abaixo <em>não</em> faz parte da definição de anel de Dedekind?",
      o: ["Todo ideal é principal.",
          "É noetheriano.",
          "É integralmente fechado no seu corpo de frações.",
          "Todo ideal primo não nulo é maximal."],
      e: "Todo $\\OK$ é de Dedekind, mas nem todo é domínio de ideais principais: em $\\Z[\\sqrt{-5}]$, o ideal $\\langle 2, 1+\\sqrt{-5}\\rangle$ não é principal. Ser DIP é justamente o que o número de classes mede." },
    { t: 0, dica: "dica 30",
      q: "Por que $D = \\Z[\\sqrt{-3}]$ não é um anel de Dedekind?",
      o: ["Não é integralmente fechado: $\\frac{1+\\sqrt{-3}}{2}$ é raiz de $x^2 - x + 1$, está no corpo de frações de $D$ e não está em $D$.",
          "Não é noetheriano.",
          "Tem um ideal primo não nulo que não é maximal.",
          "Não é um domínio de integridade."],
      e: "$D$ é noetheriano e seus primos não nulos são maximais (os quocientes são finitos). O que falha é o fecho integral: o anel de inteiros de $\\Q(\\sqrt{-3})$ é $\\Z\\bigl[\\frac{1+\\sqrt{-3}}{2}\\bigr] \\supsetneq D$. Uma consequência: com $P = \\langle 2, 1+\\sqrt{-3}\\rangle$, vale $P^2 = 2P$ mas $P \\neq \\langle 2\\rangle$, e o cancelamento falha." },
    { t: 0, dica: "dica 31",
      q: "Em $\\OK = \\Z[\\sqrt{-5}]$, seja $P = \\langle 2, 1+\\sqrt{-5}\\rangle$, com $P^2 = \\langle 2 \\rangle$. Quem é $P^{-1} = \\{\\alpha \\in K : \\alpha P \\subseteq \\OK\\}$?",
      o: ["$\\tfrac12 P$", "$2P$", "$P$", "$\\OK$"],
      e: "$P \\cdot \\tfrac12 P = \\tfrac12 P^2 = \\tfrac12 \\langle 2\\rangle = \\OK$, e o inverso de um ideal fracionário é único. Repare que $\\frac{1+\\sqrt{-5}}{2} \\in P^{-1} \\setminus \\OK$: o inverso é estritamente maior que $\\OK$ e não é um ideal de $\\OK$." },
    { t: 0, dica: "dica 32",
      q: "Sejam $P \\neq Q$ ideais primos não nulos, $I = P^2 Q$ e $J = P Q^3$. Então:",
      o: ["$I + J = PQ$ e $I \\cap J = P^2Q^3$.",
          "$I + J = P^2Q^3$ e $I \\cap J = PQ$.",
          "$I + J = P^3Q^4$ e $I \\cap J = PQ$.",
          "$I + J = \\OK$ e $I \\cap J = IJ$."],
      e: "Como dividir é conter, $I + J$ é o maior divisor comum (expoentes mínimos) e $I \\cap J$ o menor múltiplo comum (expoentes máximos). Confira: $(I+J)(I \\cap J) = P^3Q^4 = IJ$." },

    // ---------- Tema 1: norma
    { t: 1, dica: "dica 33",
      q: "Quantos ideais de $\\Z[i]$ têm norma $5$?",
      o: ["Dois: $\\langle 2+i \\rangle$ e $\\langle 2-i \\rangle$.",
          "Um: $\\langle 5 \\rangle$.",
          "Nenhum.",
          "Quatro: $\\langle 2+i\\rangle$, $\\langle 2-i\\rangle$, $\\langle -2+i\\rangle$ e $\\langle -2-i\\rangle$."],
      e: "Um ideal de norma prima é primo, então os ideais de norma $5$ são os primos acima de $5$: $\\langle 5\\rangle = \\langle 2+i\\rangle\\langle 2-i\\rangle$. O ideal $\\langle 5 \\rangle$ tem norma $25$, e $\\langle -2-i\\rangle = \\langle 2+i\\rangle$, $\\langle -2+i\\rangle = \\langle 2-i\\rangle$, pois os geradores são associados." },
    { t: 1, dica: "dicas 14 a 16",
      q: "Se $I$ é um ideal de $\\OK$ com $\\N(I) = 15$, então:",
      o: ["$I = P_1P_2$, com $P_1$ e $P_2$ primos de normas $3$ e $5$.",
          "$I$ é um ideal primo.",
          "$I$ é necessariamente principal.",
          "$I$ pode ter três ou mais fatores primos."],
      e: "Pela multiplicatividade, $\\N(I)$ é o produto das normas dos fatores primos, e cada uma é uma potência $p^f > 1$. Como $15 = 3 \\cdot 5$, sobram exatamente dois fatores. Nada garante que $I$ seja principal." },
    { t: 1, dica: "dica 17",
      q: "Seja $P$ um ideal primo não nulo de $\\OK$, com $[K:\\Q] = n$, e $p$ o primo racional em $P$. Então:",
      o: ["$\\N(P) = p^f$ com $1 \\le f \\le n$.",
          "$\\N(P) = p$.",
          "$\\N(P) = p^n$.",
          "$\\N(P)$ pode ter um fator primo $q \\neq p$."],
      e: "$\\OK/P$ é um corpo finito de característica $p$, logo tem $p^f$ elementos. Como $\\OK/P$ é quociente de $\\OK/\\langle p\\rangle$, que tem $p^n$ elementos, $f \\le n$. Os casos $f = 1$ e $f = n$ ocorrem, mas não são os únicos." },
    { t: 1, dica: "dica 11",
      q: "Seja $I \\neq \\{0\\}$ um ideal de $\\OK$ com $\\N(I) = 6$. Qual elemento certamente pertence a $I$?",
      o: ["$6$", "$2$", "$3$", "$1$"],
      e: "O grupo aditivo $\\OK/I$ tem ordem $\\N(I) = 6$; por Lagrange, $6 \\cdot (1 + I) = 0$, isto é, $6 \\in I$. Já $1 \\in I$ só se $I = \\OK$, e $2$ ou $3$ podem não estar em $I$." },

    // ---------- Tema 2: Kummer
    { t: 2, dica: "dicas 23 e 27",
      q: "Seja $K = \\Q(\\sqrt[3]{2})$, com $\\OK = \\Z[\\sqrt[3]{2}]$. Como o ideal $\\langle 5 \\rangle$ se fatora?",
      o: ["$\\langle 5\\rangle = P_1P_2$, com $\\N(P_1) = 5$ e $\\N(P_2) = 25$.",
          "$\\langle 5 \\rangle$ é primo.",
          "$\\langle 5 \\rangle = P^3$.",
          "$\\langle 5\\rangle = P_1P_2P_3$, cada um de norma $5$."],
      e: "Como $3^3 = 27 \\equiv 2 \\pmod 5$, temos $x^3 - 2 \\equiv (x-3)(x^2+3x+4) \\pmod 5$, e o fator quadrático é irredutível (discriminante $-7 \\equiv 3$, que não é quadrado módulo $5$). Por Kummer–Dedekind, $e_1 = e_2 = 1$, $f_1 = 1$, $f_2 = 2$ — e $1 + 2 = 3 = n$." },
    { t: 2, dica: "dicas 18 e 22",
      q: "No critério “$I_g$ é primo se, e somente se, $\\bar g$ é irredutível”, por que se exige que $\\bar g$ divida $\\bar p_\\alpha$?",
      o: ["Porque sem isso $I_g$ pode ser o anel todo: em $\\Z[i]$, com $p = 3$ e $g = x$, o polinômio $\\bar g$ é irredutível, mas $I_g = \\langle 3, i \\rangle = \\OK$.",
          "Para garantir que $g$ seja mônico.",
          "Para que $I_g$ seja finitamente gerado.",
          "Porque senão $\\bar g$ teria grau maior que $n$."],
      e: "Em geral, $\\OK/I_g \\cong \\F_p[x]/\\langle \\bar g, \\bar p_\\alpha \\rangle$, e esse quociente só depende de $\\gcd(\\bar g, \\bar p_\\alpha)$. No exemplo, $\\gcd(x, x^2+1) = 1$ em $\\F_3[x]$, então o quociente é zero e $I_g = \\OK$ — de fato, $i$ é uma unidade." },
    { t: 2, dica: "dica 24",
      q: "Num corpo $K$ de grau $6$, tem-se $\\langle p \\rangle = P_1^2 P_2$ com grau residual $f_1 = 1$. Quanto vale $f_2$?",
      o: ["$4$", "$3$", "$5$", "$1$"],
      e: "Pela identidade $\\sum e_j f_j = n$: $2 \\cdot 1 + 1 \\cdot f_2 = 6$, logo $f_2 = 4$." },
    { t: 2, dica: "dica 34",
      q: "Se $\\OK = \\Z[\\alpha]$ e $\\bar p_\\alpha = (x+1)^2(x^2+x+1)$ em $\\F_2[x]$, quantos ideais de $\\OK$ contêm $\\langle 2 \\rangle$?",
      o: ["$6$", "$2$", "$3$", "$4$"],
      e: "Conter $\\langle 2\\rangle$ é dividir $\\langle 2 \\rangle = P_1^2 P_2$. Os divisores são $P_1^a P_2^b$ com $0 \\le a \\le 2$ e $0 \\le b \\le 1$: são $3 \\cdot 2 = 6$, contando $\\OK$ e o próprio $\\langle 2 \\rangle$." },

    // ---------- Tema 3: fatoração
    { t: 3, dica: "dica 25",
      q: "Em $\\Z[\\sqrt{-2}]$, o primo $5$ é:",
      o: ["inerte.",
          "decomposto.",
          "ramificado.",
          "inerte ou decomposto, conforme o gerador escolhido para $\\OK$."],
      e: "$-2 \\equiv 3$ não é quadrado módulo $5$ (os quadrados são $0, 1, 4$), então $x^2 + 2$ é irredutível em $\\F_5[x]$ e $\\langle 5 \\rangle$ é primo, de norma $25$." },
    { t: 3, dica: "dica 26",
      q: "Em $\\Z[\\sqrt{-5}]$, temos $6 = 2 \\cdot 3 = (1+\\sqrt{-5})(1-\\sqrt{-5})$. O que explica essas duas fatorações?",
      o: ["$\\langle 6 \\rangle = P_2^2 P_3 P_3'$ com primos não principais; cada fatoração de $6$ agrupa esses primos de um jeito.",
          "$2$ e $3$ não são irredutíveis em $\\Z[\\sqrt{-5}]$.",
          "$\\Z[\\sqrt{-5}]$ não é um anel de Dedekind.",
          "$2$ e $1 + \\sqrt{-5}$ são associados."],
      e: "$\\langle 2 \\rangle = P_2^2$, $\\langle 3 \\rangle = P_3P_3'$, e $\\langle 1 \\pm \\sqrt{-5} \\rangle$ é o produto de $P_2$ por um dos primos acima de $3$. Não há elementos de norma $2$ ou $3$ ($a^2 + 5b^2$ nunca vale $2$ ou $3$), logo esses primos não são principais — e é isso que torna $2$, $3$ e $1 \\pm \\sqrt{-5}$ irredutíveis." },
    { t: 3, dica: "dica 28",
      q: "Em $\\Z[\\sqrt{-5}]$, o primo $5$ é ramificado. O ideal primo acima de $5$ é:",
      o: ["principal: $\\langle 5 \\rangle = \\langle \\sqrt{-5} \\rangle^2$.",
          "não principal, porque $5$ é ramificado.",
          "o próprio $\\langle 5 \\rangle$.",
          "$\\langle 5, 1 + \\sqrt{-5} \\rangle$, que não é principal."],
      e: "$x^2 + 5 \\equiv x^2 \\pmod 5$ dá $\\langle 5 \\rangle = P^2$ com $P = \\langle 5, \\sqrt{-5}\\rangle = \\langle \\sqrt{-5} \\rangle$, pois $5 = -(\\sqrt{-5})^2$. Ramificação e principalidade são coisas independentes. Já $\\langle 5, 1+\\sqrt{-5}\\rangle = \\OK$: ele contém $6 - 5 = 1$." },

  /* ------------------------------------------------------------------
     Sorteio: a cada tentativa, 4 questões de cada tema, escolhidas
     entre as 40 do banco. Dá preferência às menos vistas neste navegador.
  ------------------------------------------------------------------ */
  var PER_TOPIC = 4;
  var SEEN_KEY = "quiz-p2-tan:vistas:v1";
  function shuffleArr(a) {
    a = a.slice();
    for (var j = a.length - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[r]; a[r] = t;
    }
    return a;
  }
  function loadSeen() {
    try { var v = JSON.parse(localStorage.getItem(SEEN_KEY)); return (v && typeof v === "object") ? v : {}; }
    catch (e) { return {}; }
  }
  function saveSeen(v) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(v)); } catch (e) {} }
  var seen = loadSeen();
  function draw() {
    var sel = [];
    TOPICS.forEach(function (tp, ti) {
      var pool = [];
      BANK.forEach(function (q, bi) { if (q.t === ti) pool.push(bi); });
      pool = shuffleArr(pool);
      pool.sort(function (a, b) { return (seen[a] || 0) - (seen[b] || 0); });
      pool.slice(0, PER_TOPIC).forEach(function (bi) { sel.push(bi); });
    });
    sel.forEach(function (bi) { seen[bi] = (seen[bi] || 0) + 1; });
    saveSeen(seen);
    return sel.map(function (bi) { return BANK[bi]; });
  }
  var QUESTIONS = (function () {
    var out = [];
    TOPICS.forEach(function (tp, ti) {
      BANK.filter(function (q) { return q.t === ti; }).slice(0, PER_TOPIC).forEach(function (q) { out.push(q); });
    });
    return out;
  })();

  var state = { i: 0, answers: [], order: [] };

  var mjResolve;
  var mjReady = new Promise(function (res) { mjResolve = res; });
  window.__mjReady = function () { mjResolve(); };
  setTimeout(function () { mjResolve(); }, 8000);

  function typeset(el) {
    return mjReady.then(function () {
      if (window.MathJax && MathJax.typesetPromise) {
        return MathJax.typesetPromise([el]).catch(function () {});
      }
    });
  }
  function clearMath(el) {
    if (window.MathJax && MathJax.typesetClear) { try { MathJax.typesetClear([el]); } catch (e) {} }
  }
  function shuffle(n) {
    var a = [];
    for (var k = 0; k < n; k++) a.push(k);
    for (var j = n - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[r]; a[r] = t;
    }
    return a;
  }

  /* ------------------------------------------------------------------
     Régua de tracinhos
  ------------------------------------------------------------------ */
  function renderTally() {
    var html = "";
    TOPICS.forEach(function (tp, ti) {
      html += '<div class="group"><div class="marks">';
      QUESTIONS.forEach(function (q, qi) {
        if (q.t !== ti) return;
        var cls = "mark";
        var a = state.answers[qi];
        if (a === true) cls += " right";
        else if (a === false) cls += " wrong";
        else if (qi === state.i && state.started && !state.done) cls += " current";
        html += '<span class="' + cls + '"></span>';
      });
      html += '</div><span class="group-name">' + tp.name + "</span></div>";
    });
    var answered = state.answers.filter(function (x) { return x !== undefined; }).length;
    html += '<span class="count">' + answered + " de " + QUESTIONS.length + "</span>";
    tally.innerHTML = html;
  }

  var nomeAluno = "";
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function renderIntro() {
    clearMath(app);
    var rows = TOPICS.map(function (tp) {
      return '<li><span class="t-name">' + tp.long + '</span><span class="t-dicas">' + tp.dicas + "</span></li>";
    }).join("");
    app.innerHTML =
      "<h1>Quiz de preparação para a P2</h1>" +
      '<p class="lead">Teoria Algébrica dos Números. São 20 questões de múltipla escolha, quatro por tema, sorteadas a cada tentativa de um banco de 40 — oito por tema. Ao refazer o quiz, você recebe de preferência questões que ainda não viu. ' +
      "Cada resposta é corrigida na hora, com a justificativa e a dica da lista que trata do assunto. " +
      "No final, você vê em quais temas está seguro e quais precisa rever.</p>" +
      '<ul class="topics">' + rows + "</ul>" +
      '<div class="nome-box"><label for="nome">Seu nome</label>' +
      '<input id="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo" value="' + esc(nomeAluno) + '">' +
      '<p class="erro" id="nome-erro"></p></div>' +
      '<div class="nav"><button class="btn" id="start">Começar o quiz</button>' +
      '<span class="hint">Use as teclas 1 a 4 para responder e Enter para avançar.</span></div>';
    var campo = document.getElementById("nome");
    function comecar() {
      var n = campo.value.trim();
      if (!n) { document.getElementById("nome-erro").textContent = "Escreva seu nome para começar."; campo.focus(); return; }
      nomeAluno = n;
      start();
    }
    document.getElementById("start").addEventListener("click", comecar);
    campo.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); comecar(); } });
    renderTally();
  }

  function start() {
    QUESTIONS = draw();
    state = { i: 0, answers: [], order: QUESTIONS.map(function (q) { return shuffle(q.o.length); }), started: true, done: false };
    renderQuestion();
  }

  function renderQuestion() {
    var qi = state.i, q = QUESTIONS[qi], order = state.order[qi];
    clearMath(app);
    var opts = order.map(function (oi, pos) {
      return '<button class="opt" data-oi="' + oi + '"><span class="key">' + KEYS[pos] + "</span><span>" + q.o[oi] + "</span></button>";
    }).join("");
    app.innerHTML =
      '<p class="q-topic">Questão ' + (qi + 1) + " de " + QUESTIONS.length + ": " + TOPICS[q.t].long + "</p>" +
      '<div class="q-text">' + q.q + "</div>" +
      '<div class="opts" role="group" aria-label="Alternativas">' + opts + "</div>" +
      '<div id="fb"></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () { answer(parseInt(b.getAttribute("data-oi"), 10)); });
    });
    renderTally();
    typeset(app).then(function () {
      var first = app.querySelector(".opt");
      if (first) first.focus({ preventScroll: true });
    });
    window.scrollTo({ top: 0 });
  }

  function answer(oi) {
    var qi = state.i;
    if (state.answers[qi] !== undefined) return;
    var q = QUESTIONS[qi];
    var ok = oi === 0;
    state.answers[qi] = ok;
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      var bo = parseInt(b.getAttribute("data-oi"), 10);
      b.disabled = true;
      if (bo === 0) b.classList.add("is-right");
      else if (bo === oi) b.classList.add("is-wrong");
      else b.classList.add("faded");
    });
    var last = qi === QUESTIONS.length - 1;
    var fb = document.getElementById("fb");
    fb.innerHTML =
      '<div class="feedback ' + (ok ? "right" : "wrong") + '">' +
      '<p class="verdict">' + (ok ? "Correto." : "Não é essa.") + "</p>" +
      '<p class="expl">' + q.e + "</p>" +
      '<p class="see">Para rever: ' + q.dica + " da lista de dicas.</p></div>" +
      '<div class="nav"><button class="btn" id="next">' + (last ? "Ver o diagnóstico" : "Próxima questão") + "</button></div>";
    document.getElementById("next").addEventListener("click", next);
    renderTally();
    typeset(fb).then(function () {
      document.getElementById("next").focus({ preventScroll: true });
      fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
  }

  function next() {
    if (state.i < QUESTIONS.length - 1) { state.i++; renderQuestion(); }
    else { state.done = true; renderResults(); }
  }

  function verdictFor(n) {
    if (n === 4) return { cls: "ok", txt: "Seguro neste tema." };
    if (n === 3) return { cls: "mid", txt: "Quase lá: reveja a questão que errou." };
    return { cls: "weak", txt: "Ponto fraco: vale estudar este tema antes da prova." };
  }

  function renderResults() {
    clearMath(app);
    var total = state.answers.filter(function (x) { return x === true; }).length;
    var diag = TOPICS.map(function (tp, ti) {
      var marks = "", right = 0;
      QUESTIONS.forEach(function (q, qi) {
        if (q.t !== ti) return;
        var a = state.answers[qi];
        if (a) right++;
        marks += '<span class="mark ' + (a ? "right" : "wrong") + '"></span>';
      });
      var v = verdictFor(right);
      var extra = right < 4 ? " Revise as " + tp.dicas + "." : "";
      return '<li><div class="diag-head"><span class="diag-name">' + tp.long + '</span><span class="marks">' + marks +
             '</span><span>' + right + " de 4</span></div>" +
             '<p class="diag-verdict ' + v.cls + '">' + v.txt + extra + "</p></li>";
    }).join("");

    var wrong = [];
    QUESTIONS.forEach(function (q, qi) { if (state.answers[qi] === false) wrong.push(qi); });
    var review = wrong.length === 0
      ? "<p>Você acertou todas. Ainda assim, vale escrever à mão as demonstrações das dicas: na prova, as questões pedem provas completas.</p>"
      : wrong.map(function (qi) {
          var q = QUESTIONS[qi];
          return '<div class="review-item"><div class="q-text">' + (qi + 1) + ". " + q.q + "</div>" +
                 '<p class="ans"><span class="label-right">Resposta:</span> ' + q.o[0] + "</p>" +
                 '<p class="ans">' + q.e + "</p>" +
                 '<p class="see">Para rever: ' + q.dica + ".</p></div>";
        }).join("");

    app.innerHTML =
      "<h1>Seu diagnóstico</h1>" +
      '<div class="ident"><p class="quem">' + esc(nomeAluno) + '</p>' +
      '<p class="quando">Concluído em ' + new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + '</p>' +
      '<p class="nota">' + total + " de " + QUESTIONS.length + " acertos</p></div>" +
      '<p class="lead">Cada linha mostra um tema da prova. Os temas em vermelho são os que pedem mais estudo; ' +
      "a numeração das dicas é a da lista distribuída para a P2.</p>" +
      '<ul class="diag">' + diag + "</ul>" +
      (wrong.length ? "<h2>As questões que você errou</h2>" : "<h2>Resultado</h2>") +
      '<div class="review">' + review + "</div>" +
      '<div class="nav"><button class="btn" id="again">Refazer o quiz</button>' +
      '<a class="btn ghost" href="index.html">Outros testes da disciplina</a>' +
      '<a class="btn ghost" href="../index.html">Voltar às disciplinas</a></div>';
    document.getElementById("again").addEventListener("click", start);
    renderTally();
    typeset(app);
    window.scrollTo({ top: 0 });
  }

  /* ------------------------------------------------------------------
     Teclado
  ------------------------------------------------------------------ */
  document.addEventListener("keydown", function (ev) {
    if (!state.started || state.done) return;
    if (ev.key >= "1" && ev.key <= "4") {
      var b = app.querySelectorAll(".opt")[parseInt(ev.key, 10) - 1];
      if (b && !b.disabled) { ev.preventDefault(); b.click(); }
    } else if (ev.key === "Enter" || ev.key === "ArrowRight") {
      var n = document.getElementById("next");
      if (n && state.answers[state.i] !== undefined) { ev.preventDefault(); n.click(); }
    }
  });

  renderIntro();
})();
</script>
</body>
</html>
