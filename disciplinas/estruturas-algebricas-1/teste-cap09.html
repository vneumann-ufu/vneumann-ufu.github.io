  "e": "5·<span style=\"text-decoration:overline\">a</span> = <span style=\"text-decoration:overline\">5a</span> = <span style=\"text-decoration:overline\">0</span>, e m·<span style=\"text-decoration:overline\">1</span> ≠ <span style=\"text-decoration:overline\">0</span> para 0 &lt; m &lt; 5."
 },

<script>
(function () {
  var N = 0; TEMAS.forEach(function (t) { N += t.n; });
  var state = { i: 0, answers: [], order: [], sel: [], started: false, done: false };
  var app = document.getElementById("app");
  var tally = document.getElementById("tally");
  var KEYS = ["a", "b", "c", "d", "e", "f"];
  var nomeAluno = "";
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function shuffle(n) {
    var a = []; for (var k = 0; k < n; k++) a.push(k);
    for (var j = n - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[r]; a[r] = t; }
    return a;
  }
  function sortear() {
    var sel = [];
    TEMAS.forEach(function (t, k) {
      var pool = [];
      BANCO.forEach(function (q, qi) { if (q.t === k) pool.push(qi); });
      var idx = shuffle(pool.length);
      for (var j = 0; j < t.n && j < pool.length; j++) sel.push(pool[idx[j]]);
    });
    return sel;
  }
  function Q(i) { return BANCO[state.sel[i]]; }
  function renderTally() {
    var h = '<div class="group"><div class="marks">';
    for (var qi = 0; qi < N; qi++) {
      var cls = "mark", a = state.answers[qi];
      if (a === true) cls += " right"; else if (a === false) cls += " wrong";
      else if (state.started && !state.done && qi === state.i) cls += " current";
      h += '<span class="' + cls + '"></span>';
    }
    h += '</div><span class="group-name">' + INFO.curto + "</span></div>";
    var answered = state.answers.filter(function (x) { return x !== undefined; }).length;
    h += '<span class="count">' + answered + " de " + N + "</span>";
    tally.innerHTML = h;
  }
  function renderIntro() {
    var temas = TEMAS.map(function (t) { return t.nome + " (" + t.n + ")"; }).join("; ");
    app.innerHTML =
      "<h1>" + INFO.titulo + "</h1>" +
      '<p class="lead">Estruturas Algébricas 1 · ' + INFO.capitulo + ". A cada tentativa são sorteadas " + N +
      " questões de múltipla escolha de um banco de " + BANCO.length + ", divididas por tema: " + temas + ". " +
      "Cada resposta é corrigida na hora, com a explicação. No final, você vê seu resultado, o desempenho em cada tema " +
      "e as questões que errou. Ao refazer o teste, as questões mudam.</p>" +
      '<div class="nome-box"><label for="nome">Seu nome</label>' +
      '<input id="nome" type="text" autocomplete="name" placeholder="Digite seu nome completo" value="' + esc(nomeAluno) + '">' +
      '<p class="erro" id="nome-erro"></p></div>' +
      '<div class="nav"><button class="btn" id="start">Começar o teste</button>' +
      '<span class="hint">Use as teclas 1 a 4 para responder e Enter para avançar.</span></div>';
    var campo = document.getElementById("nome");
    function comecar() {
      var n = campo.value.trim();
      if (!n) { document.getElementById("nome-erro").textContent = "Escreva seu nome para começar."; campo.focus(); return; }
      nomeAluno = n; start();
    }
    document.getElementById("start").addEventListener("click", comecar);
    campo.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); comecar(); } });
    renderTally();
  }
  function start() {
    var sel = sortear();
    state = { i: 0, answers: [], sel: sel, order: sel.map(function (qi) { return shuffle(BANCO[qi].o.length); }), started: true, done: false };
    renderQuestion();
  }
  function renderQuestion() {
    var qi = state.i, q = Q(qi), order = state.order[qi];
    var opts = order.map(function (oi, pos) {
      return '<button class="opt" data-oi="' + oi + '"><span class="key">' + KEYS[pos] + "</span><span>" + q.o[oi] + "</span></button>";
    }).join("");
    app.innerHTML =
      '<p class="q-topic">Questão ' + (qi + 1) + " de " + N + " · " + TEMAS[q.t].nome + "</p>" +
      '<div class="q-text">' + q.q + "</div>" +
      '<div class="opts" role="group" aria-label="Alternativas">' + opts + "</div>" +
      '<div id="fb"></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () { answer(parseInt(b.getAttribute("data-oi"), 10)); });
    });
    renderTally();
    var first = app.querySelector(".opt"); if (first) first.focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
  }
  function answer(oi) {
    var qi = state.i;
    if (state.answers[qi] !== undefined) return;
    var q = Q(qi), ok = oi === 0;
    state.answers[qi] = ok;
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      var bo = parseInt(b.getAttribute("data-oi"), 10);
      b.disabled = true;
      if (bo === 0) b.classList.add("is-right");
      else if (bo === oi) b.classList.add("is-wrong");
      else b.classList.add("faded");
    });
    var last = qi === N - 1;
    var fb = document.getElementById("fb");
    fb.innerHTML =
      '<div class="feedback ' + (ok ? "right" : "wrong") + '">' +
      '<p class="verdict">' + (ok ? "Correto." : "Não é essa.") + "</p>" +
      '<div class="expl">' + q.e + "</div></div>" +
      '<div class="nav"><button class="btn" id="next">' + (last ? "Ver o resultado" : "Próxima questão") + "</button></div>";
    document.getElementById("next").addEventListener("click", next);
    renderTally();
    document.getElementById("next").focus({ preventScroll: true });
    fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function next() {
    if (state.i < N - 1) { state.i++; renderQuestion(); }
    else { state.done = true; renderResults(); }
  }
  function comentario(acertos, n) {
    if (acertos === n) return { cls: "ok", txt: "Seguro neste tema." };
    if (2 * acertos >= n) return { cls: "mid", txt: "Quase lá: reveja as questões que errou." };
    return { cls: "low", txt: "Reveja este tema nas notas de aula." };
  }
  function renderResults() {
    var total = state.answers.filter(function (x) { return x === true; }).length;
    var frac = total / N;
    var veredito = frac === 1 ? "Você acertou todas. Muito bem!"
      : frac >= 0.75 ? "Bom resultado. Reveja as questões que errou."
      : frac >= 0.5 ? "Resultado razoável. Vale reler o capítulo nas notas de aula."
      : "Este capítulo precisa de mais estudo. Releia as notas de aula e tente de novo.";
    var porTema = TEMAS.map(function () { return 0; });
    state.sel.forEach(function (bi, qi) { if (state.answers[qi] === true) porTema[BANCO[bi].t]++; });
    var temas = TEMAS.map(function (t, k) {
      var c = comentario(porTema[k], t.n);
      return '<li><span class="tnome">' + t.nome + '<span class="tcom">' + c.txt + '</span></span>' +
             '<span class="tnota ' + c.cls + '">' + porTema[k] + " de " + t.n + "</span></li>";
    }).join("");
    var wrong = [];
    for (var qi = 0; qi < N; qi++) if (state.answers[qi] === false) wrong.push(qi);
    var review = wrong.map(function (qi) {
      var q = Q(qi);
      return '<div class="review-item"><div class="q-text">' + (qi + 1) + ". " + q.q + "</div>" +
             '<p class="ans"><span class="label-right">Resposta:</span> ' + q.o[0] + "</p>" +
             '<div class="ans">' + q.e + "</div></div>";
    }).join("");
    app.innerHTML =
      "<h1>Seu resultado</h1>" +
      '<div class="ident"><p class="quem">' + esc(nomeAluno) + "</p>" +
      '<p class="quando">' + INFO.titulo + " · concluído em " + new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + "</p>" +
      '<p class="nota">' + total + " de " + N + " acertos</p></div>" +
      '<p class="lead">' + veredito + "</p>" +
      "<h2>Desempenho por tema</h2>" + '<ul class="temas">' + temas + "</ul>" +
      (wrong.length ? '<h2>As questões que você errou</h2><div class="review">' + review + "</div>" : "") +
      '<div class="nav"><button class="btn" id="again">Refazer com novas questões</button>' +
      '<a class="btn ghost" href="index.html">Outros testes da disciplina</a>' +
      '<a class="btn ghost" href="../index.html">Voltar às disciplinas</a></div>';
    document.getElementById("again").addEventListener("click", start);
    renderTally();
    window.scrollTo({ top: 0 });
  }
  document.addEventListener("keydown", function (ev) {
    if (!state.started || state.done) return;
    if (ev.target && ev.target.tagName === "INPUT") return;
    if (ev.key >= "1" && ev.key <= "4") {
      var b = app.querySelectorAll(".opt")[parseInt(ev.key, 10) - 1];
      if (b && !b.disabled) { ev.preventDefault(); b.click(); }
    } else if (ev.key === "Enter" || ev.key === "ArrowRight") {
      var nx = document.getElementById("next");
      if (nx && state.answers[state.i] !== undefined) { ev.preventDefault(); nx.click(); }
    }
  });
  renderIntro();
})();
</script>
</body>
</html>
